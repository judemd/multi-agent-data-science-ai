[project]
name = "multi-agent-data-science-ai"
version = "0.1.0"
description = "Human-in-the-loop multi-agent data science workflow using Google ADK and Vertex AI."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
